name: Build Samsung PDF Display

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install PDF converter
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Create website
        run: |

          rm -rf site
          mkdir site

          cp index.html site/index.html

          pdftoppm \
            -jpeg \
            -r 150 \
            menu.pdf \
            site/page

          python3 - <<'PY'

          from pathlib import Path
          import re
          import json

          files = list(Path("site").glob("page-*.jpg"))

          def page_number(path):
              match = re.search(r'page-(\d+)', path.name)
              return int(match.group(1))

          files.sort(key=page_number)

          pages = [f.name for f in files]

          with open(
              "site/pages.js",
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "var PAGES = " +
                  json.dumps(pages) +
                  ";"
              )

          print("PDF pages:")
          print(pages)

          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site


  deploy:

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
